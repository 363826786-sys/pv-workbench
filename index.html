<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光伏新能源工作台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f6fa; --card: #ffffff; --text: #1f2937; --muted: #6b7280;
    --accent: #f59e0b; --accent2: #0ea5e9; --green: #10b981; --line: #e5e7eb;
  }
  body.dark {
    --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8; --line: #334155;
  }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.6; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 14px 40px; }
  header.hero { position: relative; background: linear-gradient(135deg, #1e3a5f, #0e7490); color: #fff;
    border-radius: 14px; padding: 22px 20px; margin-bottom: 16px; }
  body.dark header.hero { background: linear-gradient(135deg, #0b2440, #134e5e); }
  header.hero h1 { font-size: 22px; margin-bottom: 6px; padding-right: 60px; }
  header.hero .meta { font-size: 13px; opacity: .85; }
  header.hero .digest { margin-top: 10px; font-size: 14px; background: rgba(255,255,255,.12);
    border-radius: 8px; padding: 8px 12px; }
  .theme-btn { position: absolute; top: 18px; right: 16px; background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.4); color: #fff; border-radius: 20px;
    padding: 4px 12px; font-size: 13px; cursor: pointer; }
  section { background: var(--card); border-radius: 14px; padding: 18px; margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  section h2 { font-size: 17px; margin-bottom: 12px; padding-left: 10px;
    border-left: 4px solid var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 720px) { .grid2 { grid-template-columns: 1fr 1fr; } }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .card h3 { font-size: 15px; margin-bottom: 8px; color: #0e7490; }
  body.dark .card h3 { color: #7dd3fc; }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0;
    border-bottom: 1px dashed var(--line); font-size: 14px; }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--muted); flex-shrink: 0; }
  .kv .v { text-align: right; }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .warn { font-size: 12px; color: #b45309; margin-top: 8px; }
  body.dark .warn { color: #fbbf24; }
  .extlink { font-size: 12px; margin-top: 6px; }
  .extlink a { color: #0e7490; }
  body.dark .extlink a { color: #7dd3fc; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .search { flex: 1; min-width: 160px; padding: 7px 12px; border: 1px solid var(--line);
    border-radius: 16px; background: var(--card); color: var(--text); font-size: 14px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { padding: 4px 12px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--card); color: var(--muted); font-size: 13px; cursor: pointer; }
  .tab.on { background: #0e7490; border-color: #0e7490; color: #fff; }
  .news-cat { margin-bottom: 14px; }
  .news-cat h3 { font-size: 15px; margin-bottom: 8px; }
  .news-cat h3 .tag { display: inline-block; font-size: 12px; color: #fff; border-radius: 6px;
    padding: 1px 8px; margin-right: 6px; }
  .tag-pv { background: #f59e0b; } .tag-st { background: #0ea5e9; }
  .tag-ne { background: #10b981; } .tag-ai { background: #8b5cf6; } .tag-bid { background: #ef4444; }
  .news-item { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .news-item:last-child { border-bottom: none; }
  .news-item a { color: var(--text); text-decoration: none; font-weight: 500; }
  .news-item a:hover { color: #0e7490; text-decoration: underline; }
  .news-item .sum { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .news-item .src { font-size: 12px; color: #9ca3af; margin-top: 2px; }
  table.price { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.price th, table.price td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  table.price th { color: var(--muted); font-weight: 500; font-size: 13px; }
  table.price td.p { font-weight: 700; color: #b45309; white-space: nowrap; }
  body.dark table.price td.p { color: #fbbf24; }
  table.irr { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.irr th, table.irr td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: center; }
  table.irr th { color: var(--muted); font-weight: 500; }
  table.irr td.day { color: var(--muted); white-space: nowrap; }
  .pol-item { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .pol-item:last-child { border-bottom: none; }
  .pol-item a { color: var(--text); text-decoration: none; font-weight: 500; }
  .pol-item a:hover { color: #0e7490; text-decoration: underline; }
  .pol-item .sum { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .pol-item .dt { font-size: 12px; color: #9ca3af; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 10px; }
  .loading, .error { text-align: center; padding: 60px 20px; color: var(--muted); }
  .error { color: #b91c1c; }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
  .calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .calc-grid { grid-template-columns: 1fr; } }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .field input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--text); font-size: 14px; }
  .calc-result { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .calc-result .big { font-size: 20px; font-weight: 700; color: #b45309; }
  body.dark .calc-result .big { color: #fbbf24; }
  .chart-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; margin: 8px 0; color: var(--muted); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
  svg.chart { width: 100%; height: auto; display: block; }
  html { scroll-behavior: smooth; }
  section { scroll-margin-top: 76px; }
  .topnav { position: sticky; top: 0; z-index: 50; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px 10px; margin-bottom: 16px; display: flex; gap: 6px;
    flex-wrap: wrap; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .topnav a { font-size: 13px; color: var(--muted); text-decoration: none; padding: 5px 12px;
    border-radius: 14px; border: 1px solid var(--line); white-space: nowrap; }
  .topnav a:hover { color: #0e7490; border-color: #0e7490; }
  body.dark .topnav a:hover { color: #7dd3fc; border-color: #7dd3fc; }
  .btn { display: inline-block; padding: 8px 20px; border-radius: 18px; border: none;
    background: #0e7490; color: #fff; font-size: 14px; cursor: pointer; }
  .btn:hover { opacity: .9; }
  .collapsed { display: none; }
  #calcBody { margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">工作台加载中…</div>
</div>

<script>
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function fmtTime(iso) {
  try {
    const d = new Date(iso);
    const p = n => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) +
           " " + p(d.getHours()) + ":" + p(d.getMinutes());
  } catch (e) { return iso || ""; }
}
const CAT_TAG = { "光伏": "tag-pv", "储能": "tag-st", "新能源": "tag-ne", "AI": "tag-ai", "招投标": "tag-bid" };
const CAT_ORDER = ["光伏", "储能", "新能源", "AI", "招投标"];
const CHART_COLORS = ["#f59e0b", "#0ea5e9", "#10b981", "#8b5cf6", "#ef4444"];
let NEWS = [];
let activeCat = "全部";
let query = "";

/* ---------- 深色模式 ---------- */
function initTheme() {
  let dark;
  try {
    const saved = localStorage.getItem("wb-theme");
    dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  } catch (e) {
    dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  document.body.classList.toggle("dark", dark);
  const b = document.getElementById("themeBtn");
  if (b) b.textContent = dark ? "☀️ 浅色" : "🌙 深色";
}
function toggleTheme() {
  const dark = !document.body.classList.contains("dark");
  document.body.classList.toggle("dark", dark);
  try { localStorage.setItem("wb-theme", dark ? "dark" : "light"); } catch (e) {}
  const b = document.getElementById("themeBtn");
  if (b) b.textContent = dark ? "☀️ 浅色" : "🌙 深色";
}

function toggleCalc() {
  const body = document.getElementById("calcBody");
  const btn = document.getElementById("calcToggle");
  const collapsed = body.classList.toggle("collapsed");
  btn.textContent = collapsed ? "🧮 打开测算器" : "收起测算器";
  if (!collapsed) calc();
}
function gotoCalc(e) {
  if (e) e.preventDefault();
  const body = document.getElementById("calcBody");
  const btn = document.getElementById("calcToggle");
  if (body.classList.contains("collapsed")) {
    body.classList.remove("collapsed");
    btn.textContent = "收起测算器";
    calc();
  }
  document.getElementById("sec-calc").scrollIntoView({ behavior: "smooth" });
}

/* ---------- 资讯：搜索 + 分类 ---------- */
function newsItemHtml(n) {
  const link = n.url
    ? '<a href="' + esc(n.url) + '" target="_blank" rel="noopener">' + esc(n.title) + "</a>"
    : esc(n.title);
  return '<div class="news-item" data-cat="' + esc(n.category) + '">' + link +
    (n.summary ? '<div class="sum">' + esc(n.summary) + "</div>" : "") +
    '<div class="src">' + esc(n.date || "") + (n.source ? " · " + esc(n.source) : "") + "</div></div>";
}
function renderNews() {
  const box = document.getElementById("newsList");
  if (!box) return;
  let items = NEWS.filter(n => activeCat === "全部" || n.category === activeCat);
  if (query) {
    const q = query.toLowerCase();
    items = items.filter(n => (n.title + " " + (n.summary || "")).toLowerCase().indexOf(q) >= 0);
  }
  if (!items.length) { box.innerHTML = '<div class="empty">没有匹配的资讯。</div>'; return; }
  let html = "";
  CAT_ORDER.forEach(cat => {
    const list = items.filter(n => n.category === cat);
    if (!list.length) return;
    html += '<div class="news-cat"><h3><span class="tag ' + (CAT_TAG[cat] || "tag-ne") + '">' +
      esc(cat) + "</span>最新动态</h3>";
    list.forEach(n => { html += newsItemHtml(n); });
    html += "</div>";
  });
  box.innerHTML = html;
}
function setCat(cat, el) {
  activeCat = cat;
  const tabs = document.querySelectorAll(".tab");
  tabs.forEach(t => t.classList.toggle("on", t === el));
  renderNews();
}
function onSearch(v) { query = (v || "").trim(); renderNews(); }

/* ---------- 收益测算器 ---------- */
function num(id, def) {
  const v = parseFloat((document.getElementById(id) || {}).value);
  return isNaN(v) ? def : v;
}
function calc() {
  const cap = num("c_cap", 100);        // kW
  const hours = num("c_hours", 1100);   // 年利用小时数
  const selfR = num("c_self", 80) / 100;
  const cost = num("c_cost", 3.2);      // 元/W
  const pPeak = num("c_peak", 1.12), pFlat = num("c_flat", 0.67), pVal = num("c_val", 0.27);
  const fi = num("c_fi", 0.453);
  const gen = cap * hours;
  const selfKwh = gen * selfR;
  const expKwh = gen - selfKwh;
  const wAvg = pPeak * 0.3 + pFlat * 0.5 + pVal * 0.2;
  const saveMoney = selfKwh * wAvg;
  const fiMoney = expKwh * fi;
  const total = saveMoney + fiMoney;
  const invest = cap * 1000 * cost;
  const years = total > 0 ? invest / total : 0;
  const f = n => (Math.round(n * 10) / 10).toLocaleString("zh-CN");
  const box = document.getElementById("calcResult");
  if (!box) return;
  box.innerHTML =
    '<div class="kv"><span class="k">年发电量</span><span class="v">' + f(gen) + " kWh</span></div>" +
    '<div class="kv"><span class="k">自发自用（' + Math.round(selfR * 100) + '%）节省电费</span><span class="v">' + f(saveMoney) + " 元</span></div>" +
    '<div class="kv"><span class="k">余电上网收入</span><span class="v">' + f(fiMoney) + " 元</span></div>" +
    '<div class="kv"><span class="k">年总收益</span><span class="v big">' + f(total) + " 元</span></div>" +
    '<div class="kv"><span class="k">总投资</span><span class="v">' + f(invest) + " 元</span></div>" +
    '<div class="kv"><span class="k">静态回本年限</span><span class="v big">' + (total > 0 ? years.toFixed(1) : "—") + " 年</span></div>" +
    '<div class="note">自用电加权平均电价 ' + wAvg.toFixed(3) + " 元/kWh（按峰30%/平50%/谷20%估算）</div>";
}

/* ---------- 辐照预报（Open-Meteo） ---------- */
const IRR_CITIES = [["广州", 23.13, 113.26], ["深圳", 22.54, 114.06], ["佛山", 23.02, 113.12]];
async function loadIrr() {
  const box = document.getElementById("irrBody");
  if (!box) return;
  try {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=23.13,22.54,23.02" +
      "&longitude=113.26,114.06,113.12&daily=shortwave_radiation_sum" +
      "&timezone=Asia%2FShanghai&forecast_days=7";
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const arr = await res.json();
    if (!Array.isArray(arr) || !arr.length || !arr[0].daily) throw new Error("数据格式异常");
    const days = arr[0].daily.time;
    let html = '<table class="irr"><tr><th>日期</th>';
    IRR_CITIES.forEach(c => { html += "<th>" + esc(c[0]) + "</th>"; });
    html += "</tr>";
    days.forEach((d, i) => {
      html += '<tr><td class="day">' + esc(d.slice(5)) + "</td>";
      arr.forEach((city, ci) => {
        const mj = city.daily.shortwave_radiation_sum[i];
        const kwh = (mj == null ? null : mj / 3.6);
        html += "<td>" + (kwh == null ? "—" : kwh.toFixed(1)) + "</td>";
      });
      html += "</tr>";
    });
    html += "</table>" +
      '<div class="note">未来7天水平面太阳总辐照（kWh/㎡/天），数据来源 Open-Meteo，辐照越高发电预期越好。</div>';
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = '<div class="empty">辐照数据加载失败（' + esc(e.message) + "），请稍后刷新重试。</div>";
  }
}

/* ---------- 价格走势图（原生 SVG，指数化） ---------- */
async function drawChart() {
  const wrap = document.getElementById("trendChart");
  if (!wrap) return;
  let hist = null;
  try {
    const res = await fetch("history.json", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    hist = await res.json();
  } catch (e) {
    wrap.innerHTML = '<div class="empty">走势数据加载失败，等待下次更新。</div>';
    return;
  }
  if (!hist || hist.length < 2) {
    wrap.innerHTML = '<div class="empty">历史数据积累中（当前' + (hist ? hist.length : 0) +
      '期），每日更新后将形成价格走势。</div>';
    return;
  }
  const keys = [];
  hist.forEach(s => (s.items || []).forEach(it => { if (keys.indexOf(it.key) < 0) keys.push(it.key); }));
  const series = keys.map((k, ki) => {
    const vals = hist.map(s => {
      const it = (s.items || []).find(x => x.key === k);
      return it ? it.mid : null;
    });
    const first = vals.find(v => v != null);
    const unit = ((hist.map(s => (s.items || []).find(x => x.key === k)).find(x => x) || {}).unit) || "";
    return { key: k, color: CHART_COLORS[ki % CHART_COLORS.length], unit: unit,
             idx: vals.map(v => v == null || !first ? null : v / first * 100) };
  }).filter(s => s.idx.some(v => v != null));
  if (!series.length) { wrap.innerHTML = '<div class="empty">暂无可绘制的价格序列。</div>'; return; }

  const W = 620, H = 260, PL = 44, PR = 12, PT = 14, PB = 30;
  let lo = Infinity, hi = -Infinity;
  series.forEach(s => s.idx.forEach(v => { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }));
  if (hi - lo < 1) { hi += 0.5; lo -= 0.5; }
  const pad = (hi - lo) * 0.15; lo -= pad; hi += pad;
  const n = hist.length;
  const X = i => PL + (W - PL - PR) * (n === 1 ? 0.5 : i / (n - 1));
  const Y = v => PT + (H - PT - PB) * (1 - (v - lo) / (hi - lo));
  let svg = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '">';
  [0.25, 0.5, 0.75].forEach(f => {
    const y = PT + (H - PT - PB) * f;
    svg += '<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + y.toFixed(1) +
      '" stroke="var(--line)" stroke-width="1"/>';
  });
  svg += '<text x="4" y="' + (Y(hi) + 4).toFixed(1) + '" font-size="11" fill="var(--muted)">' + hi.toFixed(0) + "</text>";
  svg += '<text x="4" y="' + (Y(lo) + 4).toFixed(1) + '" font-size="11" fill="var(--muted)">' + lo.toFixed(0) + "</text>";
  const xi = [0, Math.floor(n / 2), n - 1];
  xi.forEach(i => {
    svg += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" font-size="11" fill="var(--muted)" text-anchor="middle">' +
      esc(hist[i].date.slice(5)) + "</text>";
  });
  series.forEach(s => {
    let pts = "";
    s.idx.forEach((v, i) => { if (v != null) pts += X(i).toFixed(1) + "," + Y(v).toFixed(1) + " "; });
    svg += '<polyline points="' + pts + '" fill="none" stroke="' + s.color + '" stroke-width="2"/>';
    s.idx.forEach((v, i) => {
      if (v == null) return;
      svg += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="3" fill="' + s.color + '">' +
        "<title>" + esc(s.key + " " + hist[i].date + " 指数" + v.toFixed(1)) + "</title></circle>";
    });
  });
  svg += "</svg>";
  let legend = '<div class="chart-legend">';
  series.forEach(s => {
    const lastV = s.idx.filter(v => v != null).pop();
    legend += '<span><span class="dot" style="background:' + s.color + '"></span>' + esc(s.key) +
      "（指数" + (lastV != null ? lastV.toFixed(1) : "—") + "，" + esc(s.unit) + "）</span>";
  });
  legend += "</div>";
  wrap.innerHTML = legend + svg +
    '<div class="note">价格指数（首次记录=100），便于对比不同环节涨跌；原始报价见下方表格。</div>';
}

/* ---------- 主渲染 ---------- */
function render(d) {
  const el = document.getElementById("app");
  const e = d.electricity || {};
  const tou = e.tou || {};
  const fi = e.feedin || {};
  const ag = e.agency || {};
  const sp = e.spot || {};
  const gr = e.green_trade || {};
  NEWS = d.news || [];
  const sc = d.supply_chain || [];
  const pols = d.policies || [];

  let scHtml = "";
  if (sc.length) {
    scHtml = '<table class="price"><tr><th>环节</th><th>规格</th><th>价格</th><th>单位</th><th>报价日期</th></tr>';
    sc.forEach(r => {
      scHtml += "<tr><td>" + esc(r.item) + "</td><td>" + esc(r.spec) + '</td><td class="p">' +
        esc(r.price) + "</td><td>" + esc(r.unit) + "</td><td>" + esc(r.date) +
        (r.source ? "<br><small style='color:#9ca3af'>" + esc(r.source) + "</small>" : "") + "</td></tr>";
    });
    scHtml += "</table>";
  } else {
    scHtml = '<div class="empty">暂无价格数据。</div>';
  }

  let polHtml = "";
  pols.forEach(p => {
    const link = p.url
      ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.title) + "</a>"
      : esc(p.title);
    polHtml += '<div class="pol-item">' + link +
      (p.summary ? '<div class="sum">' + esc(p.summary) + "</div>" : "") +
      '<div class="dt">' + esc(p.date || "") + "</div></div>";
  });
  if (!polHtml) polHtml = '<div class="empty">暂无政策记录。</div>';

  const cats = ["全部"].concat(CAT_ORDER);
  let tabsHtml = '<div class="tabs">';
  cats.forEach((c, i) => {
    tabsHtml += '<button class="tab' + (i === 0 ? " on" : "") + '" onclick="setCat(\'' + esc(c) +
      '\', this)">' + esc(c) + "</button>";
  });
  tabsHtml += "</div>";

  el.innerHTML =

async function load() {
  try {
    const res = await fetch("data.json", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    render(d);
  } catch (e) {
    document.getElementById("app").innerHTML =
      '<div class="error">⚠️ 数据加载失败<br><small>请检查网络连接后刷新重试（' +
      esc(e.message) + "）</small></div>";
  }
}
load();
